# Zava Media — Configuration (EXAMPLE)
# Media-agency demo: Fabric Lakehouse + Eventhouse + Ontology (Fabric IQ) + Data Agent,
# consumed by a Foundry orchestrator that crosses the numbers with the client contracts.
#
# Copy this file to config.yaml and fill in your own capacity_id and tenant_id.
# config.yaml is gitignored — it carries tenant / capacity / item GUIDs.

workspace_name: "Zava Media"
capacity_id: "<YOUR_FABRIC_CAPACITY_ID>"               # GUID of your Fabric (F-SKU) capacity
capacity_region: "swedencentral"                       # capacity home region = OneLake data residency.
                                                       # Keep the Foundry project in the same region:
                                                       # a cross-region Fabric data agent tool call adds
                                                       # a network hop to an already multi-hop path.
fabric_api_base: "https://api.fabric.microsoft.com/v1"
tenant_id: "<YOUR_TENANT_ID>"                          # your Entra tenant GUID
# az_subscription: "<YOUR_AZ_SUBSCRIPTION_NAME>"       # optional: deploy_all.py runs `az account set` with this

# ── Fabric items ─────────────────────────────────────────────────
lakehouse_name: "ZavaMediaLH"          # single lakehouse, dim/fact schemas
eventhouse_name: "RT_Zava_Media"
kql_db_name: "EventsDB"
ontology_name: "ONT_Zava_Media"
data_agent_name: "Zava_Media_Analyst"  # Fabric side: answers the numbers
semantic_model_name: "SM_Zava_Media"
report_name: "Zava_Media_Report"

# ── Foundry (phase 2) ────────────────────────────────────────────
foundry:
  project_name: "fdy-zavamedia"
  region: "swedencentral"                       # must match capacity_region above
  orchestrator_agent_name: "Zava_Media_Agent"   # Foundry side: routes + synthesises
  fabric_connection_name: "zava_media_dataagent"
  knowledge_base_name: "zava-media-contracts"
  # Foundry agent names ARE their API identifier and there is no rename operation.
  # Changing a name here means recreating the agent and editing every router prompt.

# ── The demo question ────────────────────────────────────────────
# "On the Q3 for this advertiser in Spain we over-delivered — does the contract
#  provide for compensation?"
#   → first half  = a number, computed in Fabric (DAX / GQL)
#   → second half = a clause, retrieved by Foundry IQ from data/contracts/
demo_question_advertiser: "ADV-001"
demo_question_market: "MKT-ES"
demo_question_quarter: "2026-Q3"

# ── Planted anomalies ────────────────────────────────────────────
# Without these the demo proves nothing. Each one is exact: the generator
# normalises the daily series so the quarterly total lands on the ratio below,
# which means the agent's percentage is verifiable by hand.
anomalies:
  over_delivery:
    advertiser_id: "ADV-001"          # Contoso Mobility — HAS a make-good clause
    market_id: "MKT-ES"
    quarter: "2026-Q3"
    impression_ratio: 1.12            # +12% impressions delivered for the same spend
  under_delivery:
    advertiser_id: "ADV-002"          # Fabrikam Beauty — under-delivery carries a penalty
    market_id: "MKT-IT"
    quarter: "2026-Q3"
    impression_ratio: 0.92            # -8%
  over_delivery_no_clause:
    advertiser_id: "ADV-004"          # Litware Retail — NO make-good clause
    market_id: "MKT-UK"
    quarter: "2026-Q3"
    impression_ratio: 1.11            # same situation, different contract → different answer
  unbilled:
    advertiser_id: "ADV-004"          # delivered but never invoiced
    market_id: "MKT-UK"
    quarter: "2026-Q3"
    month: "2026-09"

# ── Generation parameters ────────────────────────────────────────
generation:
  seed: 42
  year: 2026
  quarters:
    - { id: "2026-Q2", start: "2026-04-01", end: "2026-06-30" }
    - { id: "2026-Q3", start: "2026-07-01", end: "2026-09-30" }
  markets_per_brand: 4          # 10 brands x 4 markets x 2 quarters = 80 campaigns
  placements_per_campaign: 3    # campaign x channel x media owner
  pacing_days: 7                # trailing live-pacing window pushed to the Eventhouse
  pacing_interval_min: 60

# ── Reference data — fictional entities only ─────────────────────
# Zava Media is the AGENCY. The advertisers below are its clients.
# All names are Microsoft-canonical fictional companies. Never replace them
# with a real advertiser, brand or media owner name.

advertisers:
  - { id: "ADV-001", name: "Contoso Mobility",       legal_entity: "Contoso Mobility SA",        industry: "Automotive",            hq_market: "MKT-DE", account_director: "A. Duval" }
  - { id: "ADV-002", name: "Fabrikam Beauty",        legal_entity: "Fabrikam Beauty SAS",        industry: "Beauty & Personal Care", hq_market: "MKT-FR", account_director: "M. Laurent" }
  - { id: "ADV-003", name: "Northwind Foods",        legal_entity: "Northwind Foods Ltd",        industry: "FMCG",                  hq_market: "MKT-UK", account_director: "S. Okoye" }
  - { id: "ADV-004", name: "Litware Retail",         legal_entity: "Litware Retail Ltd",         industry: "Retail",                hq_market: "MKT-UK", account_director: "J. Bernard" }
  - { id: "ADV-005", name: "Adventure Works Travel", legal_entity: "Adventure Works Travel SpA", industry: "Travel & Leisure",      hq_market: "MKT-IT", account_director: "C. Rossi" }

brands:
  - { id: "BRD-001", name: "Contoso EV",              advertiser_id: "ADV-001", category: "Electric Vehicles" }
  - { id: "BRD-002", name: "Contoso Fleet",           advertiser_id: "ADV-001", category: "Fleet Services" }
  - { id: "BRD-003", name: "Fabrikam Skin",           advertiser_id: "ADV-002", category: "Skincare" }
  - { id: "BRD-004", name: "Fabrikam Hair",           advertiser_id: "ADV-002", category: "Haircare" }
  - { id: "BRD-005", name: "Northwind Organics",      advertiser_id: "ADV-003", category: "Organic Food" }
  - { id: "BRD-006", name: "Northwind Snacks",        advertiser_id: "ADV-003", category: "Snacking" }
  - { id: "BRD-007", name: "Litware Home",            advertiser_id: "ADV-004", category: "Home & Living" }
  - { id: "BRD-008", name: "Litware Fashion",         advertiser_id: "ADV-004", category: "Apparel" }
  - { id: "BRD-009", name: "Adventure Works Cruises", advertiser_id: "ADV-005", category: "Cruises" }
  - { id: "BRD-010", name: "Adventure Works Breaks",  advertiser_id: "ADV-005", category: "City Breaks" }

markets:
  - { id: "MKT-FR", name: "France",         country_code: "FR", currency: "EUR", region: "Western Europe" }
  - { id: "MKT-ES", name: "Spain",          country_code: "ES", currency: "EUR", region: "Southern Europe" }
  - { id: "MKT-IT", name: "Italy",          country_code: "IT", currency: "EUR", region: "Southern Europe" }
  - { id: "MKT-UK", name: "United Kingdom", country_code: "GB", currency: "GBP", region: "Northern Europe" }
  - { id: "MKT-DE", name: "Germany",        country_code: "DE", currency: "EUR", region: "Central Europe" }

# cpm_eur drives planned_impressions = budget / cpm * 1000.
# grp_channel marks the offline channels that are also planned in GRP.
channels:
  - { id: "CH-TV",   name: "TV",            group: "Offline", unit: "GRP",         cpm_eur: 22.0, grp_channel: true }
  - { id: "CH-DV",   name: "Digital Video", group: "Online",  unit: "Impressions", cpm_eur: 14.5, grp_channel: false }
  - { id: "CH-SOC",  name: "Social",        group: "Online",  unit: "Impressions", cpm_eur: 6.2,  grp_channel: false }
  - { id: "CH-SEA",  name: "Search",        group: "Online",  unit: "Clicks",      cpm_eur: 3.8,  grp_channel: false }
  - { id: "CH-DOOH", name: "DOOH",          group: "Offline", unit: "Contacts",    cpm_eur: 9.4,  grp_channel: true }
  - { id: "CH-AUD",  name: "Audio",         group: "Offline", unit: "GRP",         cpm_eur: 7.1,  grp_channel: true }
  - { id: "CH-RMN",  name: "Retail Media",  group: "Online",  unit: "Impressions", cpm_eur: 11.3, grp_channel: false }

# channels[] on a media owner is the inventory it can actually sell.
# The generator only books a placement with an owner that carries the channel.
media_owners:
  - { id: "MO-001", name: "Meridian TV",          type: "Broadcaster",    channels: ["CH-TV"] }
  - { id: "MO-002", name: "Alpine Digital",       type: "Ad Platform",    channels: ["CH-DV", "CH-SEA"] }
  - { id: "MO-003", name: "Vertex Outdoor",       type: "OOH Operator",   channels: ["CH-DOOH"] }
  - { id: "MO-004", name: "Solstice Audio",       type: "Radio Network",  channels: ["CH-AUD"] }
  - { id: "MO-005", name: "Kestrel Retail Media", type: "Retail Network", channels: ["CH-RMN"] }
  - { id: "MO-006", name: "Halcyon Social",       type: "Ad Platform",    channels: ["CH-SOC", "CH-DV"] }

campaign_objectives: ["Awareness", "Consideration", "Performance", "Loyalty"]

# ── Eventhouse / KQL tables (column order MUST match the CSV headers) ─
kql_tables:
  pacing_events:
    name: pacing_events
    columns:
      - { name: timestamp,         type: datetime }
      - { name: campaign_id,       type: string }
      - { name: channel_id,        type: string }
      - { name: media_owner_id,    type: string }
      - { name: impressions_delta, type: long }
      - { name: spend_delta,       type: real }
      - { name: pacing_index,      type: real }
