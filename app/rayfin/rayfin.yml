id: Zava Media Console
name: Zava Media Console
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    # Rayfin rewrites this list when publishing; previous hosting origins are preserved.
    # The console uses its dedicated, single-tenant Entra SPA, configured separately by
    # fabric.application.deploy_application with the hosting origin and /blank.html.
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://civic-spray-8c54cec687-swedencentral.webapp.fabricapps.net
      - https://neat-reef-7b1309d7c0-swedencentral.webapp.fabricapps.net
  data:
    enabled: false
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
  storage:
    enabled: false
  functions:
    enabled: false
