id: Zava Media Console
name: Zava Media Console
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://civic-spray-8c54cec687-swedencentral.webapp.fabricapps.net
      - https://neat-reef-7b1309d7c0-swedencentral.webapp.fabricapps.net
  data:
    enabled: false
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  storage:
    enabled: false
  functions:
    enabled: false
